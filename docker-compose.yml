services:
  # ============================================
  # Infraestrutura
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: educaonline-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - educaonline-network

  # ============================================
  # Serviços de Identidade
  # ============================================
  identidade-api:
    user: "1000:1000"
    image: educaonline/identidade-api:latest
    build:
      context: backend
      dockerfile: src/services/EducaOnline.Identidade.API/Dockerfile
    container_name: educaonline-identidade-api
    ports:
      - "7070:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/tmp/UserDatabase.db
      - JwtSettings__Segredo=${JWT_SECRET}
      - JwtSettings__HorasParaExpirar=2
      - JwtSettings__Emissor=Educaonline
      - JwtSettings__Audiencia=https://localhost
      - MessageQueueConnection__MessageBus=${MESSAGE_BUS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - dpkeys-identidade:/home/app/.aspnet/DataProtection-Keys
    networks:
      - educaonline-network

  # ============================================
  # Serviços de Conteúdo
  # ============================================
  conteudo-api:
    user: "1000:1000"
    image: educaonline/conteudo-api:latest
    build:
      context: backend
      dockerfile: src/services/EducaOnline.Conteudo.API/Dockerfile
    container_name: educaonline-conteudo-api
    ports:
      - "7183:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/tmp/ConteudoDatabase.db
      - JwtSettings__Segredo=${JWT_SECRET}
      - JwtSettings__HorasParaExpirar=2
      - JwtSettings__Emissor=Educaonline
      - JwtSettings__Audiencia=https://localhost
      - MessageQueueConnection__MessageBus=${MESSAGE_BUS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identidade-api:
        condition: service_started
    volumes:
      - dpkeys-conteudo:/home/app/.aspnet/DataProtection-Keys
    networks:
      - educaonline-network

  # ============================================
  # Serviços de Aluno
  # ============================================
  aluno-api:
    user: "1000:1000"
    image: educaonline/aluno-api:latest
    build:
      context: backend
      dockerfile: src/services/EducaOnline.Aluno.API/Dockerfile
    container_name: educaonline-aluno-api
    ports:
      - "7094:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/tmp/AlunoDatabase.db
      - JwtSettings__Segredo=${JWT_SECRET}
      - JwtSettings__HorasParaExpirar=2
      - JwtSettings__Emissor=Educaonline
      - JwtSettings__Audiencia=https://localhost
      - MessageQueueConnection__MessageBus=${MESSAGE_BUS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identidade-api:
        condition: service_started
    volumes:
      - dpkeys-aluno:/home/app/.aspnet/DataProtection-Keys
    networks:
      - educaonline-network

  # ============================================
  # Serviços de Pedidos
  # ============================================
  pedidos-api:
    user: "1000:1000"
    image: educaonline/pedidos-api:latest
    build:
      context: backend
      dockerfile: src/services/Educaonline.Pedidos.API/Dockerfile
    container_name: educaonline-pedidos-api
    ports:
      - "7244:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/tmp/PedidosDatabase.db
      - JwtSettings__Segredo=${JWT_SECRET}
      - JwtSettings__HorasParaExpirar=2
      - JwtSettings__Emissor=Educaonline
      - JwtSettings__Audiencia=https://localhost
      - MessageQueueConnection__MessageBus=${MESSAGE_BUS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identidade-api:
        condition: service_started
    volumes:
      - dpkeys-pedidos:/home/app/.aspnet/DataProtection-Keys
    networks:
      - educaonline-network

  # ============================================
  # Serviços Financeiros
  # ============================================
  financeiro-api:
    user: "1000:1000"
    image: educaonline/financeiro-api:latest
    build:
      context: backend
      dockerfile: src/services/EducaOnline.Financeiro.API/Dockerfile
    container_name: educaonline-financeiro-api
    ports:
      - "7059:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/tmp/FinanceiroDatabase.db
      - JwtSettings__Segredo=${JWT_SECRET}
      - JwtSettings__HorasParaExpirar=2
      - JwtSettings__Emissor=Educaonline
      - JwtSettings__Audiencia=https://localhost
      - MessageQueueConnection__MessageBus=${MESSAGE_BUS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identidade-api:
        condition: service_started
    volumes:
      - dpkeys-financeiro:/home/app/.aspnet/DataProtection-Keys
    networks:
      - educaonline-network

  # ============================================
  # BFF Gateway
  # ============================================
  bff-api:
    user: "1000:1000"
    image: educaonline/bff-api:latest
    build:
      context: backend
      dockerfile: src/api-gateways/EducaOnline.Bff/Dockerfile
    container_name: educaonline-bff-api
    ports:
      - "7093:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - JwtSettings__Segredo=${JWT_SECRET}
      - JwtSettings__HorasParaExpirar=2
      - JwtSettings__Emissor=Educaonline
      - JwtSettings__Audiencia=https://localhost
      - ServiceUrls__IdentidadeUrl=http://identidade-api:8080
      - ServiceUrls__ConteudoUrl=http://conteudo-api:8080
      - ServiceUrls__AlunoUrl=http://aluno-api:8080
      - ServiceUrls__PedidosUrl=http://pedidos-api:8080
      - ServiceUrls__FinanceiroUrl=http://financeiro-api:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      identidade-api:
        condition: service_started
      conteudo-api:
        condition: service_started
      aluno-api:
        condition: service_started
      pedidos-api:
        condition: service_started
      financeiro-api:
        condition: service_started
    networks:
      - educaonline-network

networks:
  educaonline-network:
    driver: bridge

volumes:
  dpkeys-identidade:
  dpkeys-conteudo:
  dpkeys-aluno:
  dpkeys-pedidos:
  dpkeys-financeiro:
