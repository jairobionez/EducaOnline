apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  namespace: educaonline
  labels:
    app: bff-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      containers:
        - name: bff
          image: educaonline/bff:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: MessageQueueConnection__MessageBus
              valueFrom:
                secretKeyRef:
                  name: messagebus-secret
                  key: MESSAGE_BUS_URL
            - name: JwtSettings__Segredo
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: educaonline
spec:
  selector:
    app: bff-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
